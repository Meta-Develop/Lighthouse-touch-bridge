name: Build internal drivers

"on":
  push:
    branches:
      - main
      - feature/internal-drivers
  pull_request: {}
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: >-
    internal-drivers-${{ github.workflow }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-capabilities:
    name: Driver and package source prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.openvr.outputs.complete }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Detect pinned OpenVR source prerequisites
        id: openvr
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            "src/Ltb.OpenVr/ThirdParty/OpenVR/openvr_driver.h"
            "src/Ltb.OpenVr/runtimes/win-x64/native/openvr_api.dll"
          )
          missing_paths=()
          for path in "${required_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              missing_paths+=("$path")
            fi
          done

          if (( ${#missing_paths[@]} == 0 )); then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "The pinned OpenVR source prerequisites are present; full Windows driver and package validation is enabled." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "complete=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Full Windows driver and package validation is deferred"
            echo
            echo "The clean source tree is missing these documented pinned OpenVR inputs:"
            printf -- "- \`%s\`\n" "${missing_paths[@]}"
            echo
            echo "Portable managed/native validation remains required below. Restoring the pinned inputs is tracked by [#16](https://github.com/Meta-Develop/Lighthouse-touch-bridge/issues/16); this workflow does not download or substitute untracked build inputs."
          } >> "$GITHUB_STEP_SUMMARY"

  linux-validation:
    name: Linux managed and native-core validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Build managed solution
        run: dotnet build

      - name: Test managed solution
        run: dotnet test --no-build

      - name: Configure portable driver core
        run: >-
          cmake -S native/driver_ltb -B build/native-linux -G Ninja
          -DLTB_BUILD_OPENVR_DRIVER=OFF
          -DLTB_BUILD_TESTS=ON

      - name: Build portable driver core
        run: cmake --build build/native-linux

      - name: Test portable driver core
        run: ctest --test-dir build/native-linux --output-on-failure

  windows-driver:
    name: Windows validation and driver readiness
    needs:
      - source-capabilities
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"

      - name: Test managed log archive pruning on Windows
        run: >-
          dotnet test tests/Ltb.Integration.Tests/Ltb.Integration.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~JsonLinesInternalDriverSessionOutputTests

      - name: Configure Windows native validation
        run: >-
          cmake -S native/driver_ltb -B build/native-windows -A x64
          -DLTB_BUILD_OPENVR_DRIVER=${{
          needs.source-capabilities.outputs.complete == 'true' && 'ON' || 'OFF'
          }}
          -DLTB_BUILD_TESTS=ON

      - name: Build Windows native validation
        run: cmake --build build/native-windows --config Release

      - name: Test portable core on Windows
        run: ctest --test-dir build/native-windows -C Release --output-on-failure

      - name: Report deferred full-driver coverage
        if: needs.source-capabilities.outputs.complete != 'true'
        shell: pwsh
        run: |
          @"
          ### Full Windows driver coverage is deferred

          The portable native core was built and tested on Windows. The complete SteamVR driver build remains disabled until the documented pinned OpenVR source inputs tracked by [#16](https://github.com/Meta-Develop/Lighthouse-touch-bridge/issues/16) are restored.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Verify staged external-driver root
        if: needs.source-capabilities.outputs.complete == 'true'
        shell: pwsh
        run: |
          $stageRoot = "build/native-windows/driver_ltb"
          $requiredRelative = @(
            "build-id.txt",
            "driver.vrdrivermanifest",
            "bin/win64/driver_ltb.dll",
            "resources/input/ltb_touch_profile.json",
            "resources/input/ltb_touch_remapping.json",
            "resources/input/legacy_bindings_ltb_touch.json",
            "resources/input/bindings/bindings_ltb_touch_vrchat.json",
            "resources/settings/default.vrsettings",
            "resources/localization/localization.json",
            "resources/icons/ltb_touch.svg"
          )
          foreach ($relativePath in $requiredRelative) {
            $path = Join-Path $stageRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required staged driver file is missing: $path"
            }
          }

          $buildIdPath = Join-Path $stageRoot "build-id.txt"
          $buildIdText = [IO.File]::ReadAllText($buildIdPath, [Text.Encoding]::ASCII)
          $buildIdMatch = [Text.RegularExpressions.Regex]::Match(
            $buildIdText,
            '\A(?<identity>driver_ltb-[0-9]+\.[0-9]+\.[0-9]+-ipc-[0-9]+\.[0-9]+)\r?\n?\z',
            [Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if (-not $buildIdMatch.Success) {
            throw "Staged build-id.txt does not contain one exact driver_ltb-X.Y.Z-ipc-X.Y identity."
          }
          Write-Host "Verified staged driver identity: $($buildIdMatch.Groups['identity'].Value)"

      - name: Verify driver PE imports
        if: needs.source-capabilities.outputs.complete == 'true'
        run: >-
          python native/driver_ltb/tools/check_pe_imports.py
          --binary build/native-windows/driver_ltb/bin/win64/driver_ltb.dll

      - name: Upload Windows driver artifact
        if: needs.source-capabilities.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver_ltb-win-x64
          path: |
            build/native-windows/driver_ltb/build-id.txt
            build/native-windows/driver_ltb/driver.vrdrivermanifest
            build/native-windows/driver_ltb/bin/win64/driver_ltb.dll
            build/native-windows/driver_ltb/resources/input/ltb_touch_profile.json
            build/native-windows/driver_ltb/resources/input/ltb_touch_remapping.json
            build/native-windows/driver_ltb/resources/input/legacy_bindings_ltb_touch.json
            build/native-windows/driver_ltb/resources/input/bindings/bindings_ltb_touch_vrchat.json
            build/native-windows/driver_ltb/resources/settings/default.vrsettings
            build/native-windows/driver_ltb/resources/localization/localization.json
            build/native-windows/driver_ltb/resources/icons/ltb_touch.svg
          if-no-files-found: error
          retention-days: 14

  package-win-x64:
    name: Windows package readiness
    needs:
      - source-capabilities
      - linux-validation
      - windows-driver
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Report deferred package coverage
        if: needs.source-capabilities.outputs.complete != 'true'
        shell: bash
        run: |
          {
            echo "### Portable package coverage is deferred"
            echo
            echo "The clean source tree cannot produce the Windows package until the documented pinned OpenVR inputs tracked by [#16](https://github.com/Meta-Develop/Lighthouse-touch-bridge/issues/16) are restored."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out source without persisted credentials
        if: needs.source-capabilities.outputs.complete == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        if: needs.source-capabilities.outputs.complete == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Set up Python
        if: needs.source-capabilities.outputs.complete == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"

      - name: Download Windows driver artifact
        if: needs.source-capabilities.outputs.complete == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: driver_ltb-win-x64
          path: ${{ runner.temp }}/driver_ltb

      - name: Build and verify portable package
        if: needs.source-capabilities.outputs.complete == 'true'
        env:
          LTB_DRIVER_ROOT: ${{ runner.temp }}/driver_ltb
        run: bash build/package-win-x64.sh

      - name: Verify package outputs
        if: needs.source-capabilities.outputs.complete == 'true'
        shell: bash
        env:
          LTB_DRIVER_ROOT: ${{ runner.temp }}/driver_ltb
        run: |
          shopt -s nullglob
          archives=(artifacts/package/LighthouseTouchBridge-*-win-x64.zip)
          checksums=(artifacts/package/LighthouseTouchBridge-*-win-x64.zip.sha256)
          if (( ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            printf 'Expected exactly one portable ZIP and checksum, found %d and %d.\n' \
              "${#archives[@]}" "${#checksums[@]}" >&2
            exit 1
          fi
          checksum_name="$(basename -- "${checksums[0]}")"
          (cd artifacts/package && sha256sum --check "$checksum_name")
          python3 - "${archives[0]}" "$LTB_DRIVER_ROOT/bin/win64/driver_ltb.dll" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          archive_path = pathlib.Path(sys.argv[1])
          downloaded_driver_path = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive_path, "r") as archive:
              manifest_names = [
                  name
                  for name in archive.namelist()
                  if len(pathlib.PurePosixPath(name).parts) == 2
                  and pathlib.PurePosixPath(name).name == "release-manifest.txt"
              ]
              if len(manifest_names) != 1:
                  raise SystemExit(
                      f"Expected one package-root release-manifest.txt, found {manifest_names!r}"
                  )
              manifest_name = manifest_names[0]
              manifest_lines = archive.read(manifest_name).decode("utf-8").splitlines()
              dirty_lines = [
                  line for line in manifest_lines if line.startswith("source_tree_dirty=")
              ]
              if dirty_lines != ["source_tree_dirty=false"]:
                  raise SystemExit(
                      f"Package source_tree_dirty evidence is not exactly false: {dirty_lines!r}"
                  )

              package_root = pathlib.PurePosixPath(manifest_name).parts[0]
              driver_name = f"{package_root}/driver_ltb/bin/win64/driver_ltb.dll"
              if archive.namelist().count(driver_name) != 1:
                  raise SystemExit(
                      f"Expected one archived Windows driver at {driver_name!r}"
                  )
              archived_driver_hash = hashlib.sha256(archive.read(driver_name)).hexdigest()

          downloaded_driver_hash = hashlib.sha256(
              downloaded_driver_path.read_bytes()
          ).hexdigest()
          if archived_driver_hash != downloaded_driver_hash:
              raise SystemExit(
                  "Archived driver_ltb.dll does not match the downloaded Windows artifact: "
                  f"{archived_driver_hash} != {downloaded_driver_hash}"
              )
          print(
              "Verified clean-source manifest and exact Windows driver artifact SHA-256: "
              f"{downloaded_driver_hash}"
          )
          PY

      - name: Upload portable package
        if: needs.source-capabilities.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-touch-bridge-win-x64
          path: |
            artifacts/package/LighthouseTouchBridge-*-win-x64.zip
            artifacts/package/LighthouseTouchBridge-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
